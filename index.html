const read=new Set(JSON.parse(localStorage.getItem("commuteRead")||"[]"));
let category="すべて", unreadOnly=false, featuredOnly=false, shortOnly=false;
const cats=["すべて",...new Set(books.map(b=>b.category)), "著者で探す"];

function save(){localStorage.setItem("commuteRead",JSON.stringify([...read]));}

function renderChips(){
 const el=document.getElementById("chips"); el.innerHTML="";
 const base=["すべて","心理・認知","人間・行動","生物・進化","実験・観察","科学・技術","言語・文学","社会・文化","芸術・思想"];
 base.forEach(c=>{
   const b=document.createElement("button"); b.className="chip"+(category===c?" active":"");
   b.textContent=c; b.onclick=()=>{category=c; renderChips(); render();}; el.appendChild(b);
 });
 [...new Set(books.map(b=>b.author))].forEach(a=>{
   const b=document.createElement("button"); b.className="chip"+(category===a?" active":"");
   b.textContent=a; b.onclick=()=>{category=a; renderChips(); render();}; el.appendChild(b);
 });
}

function getList(){
 const q=document.getElementById("q").value.trim().toLowerCase();
 return books.filter(b=>{
   const catok=category==="すべて" || b.category===category || b.author===category;
   const qok=!q || [b.title,b.author,b.category,b.tag,b.desc].join(" ").toLowerCase().includes(q);
   const uok=!unreadOnly || !read.has(b.title);
   const fok=!featuredOnly || b.featured;
   const sok=!shortOnly || b.time==="5〜10分" || b.time==="好きなだけ";
   return catok&&qok&&uok&&fok&&sok;
 });
}

function render(){
 const list=getList(), grid=document.getElementById("grid"); grid.innerHTML="";
 document.getElementById("count").textContent=`${list.length} / ${books.length} 本`;
 document.getElementById("progress").textContent=`読了 ${read.size} / ${books.length}`;
 if(!list.length){grid.innerHTML='<div class="empty">条件に合う作品がありません。</div>';return;}
 list.forEach(b=>{
   const card=document.createElement("article");
   card.className="card"+(read.has(b.title)?" read":"");
   card.innerHTML=`
   <div class="meta">
     <span class="badge">${b.category}</span>
     <span class="badge time">${b.time}</span>
     ${b.featured?'<span class="badge pick">★ おすすめ</span>':''}
   </div>
   <h2>${b.title}</h2>
   <div class="author">${b.author} ・ #${b.tag}</div>
   <p class="desc">${b.desc}</p>
   <div class="actions">
     <a class="open" href="${b.url}" target="_blank" rel="noopener">作品を開く →</a>
     <button class="done">${read.has(b.title)?"✓ 読んだ":"○ 未読"}</button>
   </div>`;
   card.querySelector(".done").onclick=()=>{read.has(b.title)?read.delete(b.title):read.add(b.title);save();render();};
   grid.appendChild(card);
 });
}

document.getElementById("q").addEventListener("input",render);
document.getElementById("random").onclick=()=>{
 let pool=getList().filter(b=>!read.has(b.title)); if(!pool.length) pool=getList(); if(!pool.length)return;
 window.open(pool[Math.floor(Math.random()*pool.length)].url,"_blank");
};
document.getElementById("unreadOnly").onclick=e=>{unreadOnly=!unreadOnly;e.currentTarget.classList.toggle("active",unreadOnly);render();};
document.getElementById("featuredOnly").onclick=e=>{featuredOnly=!featuredOnly;e.currentTarget.classList.toggle("active",featuredOnly);render();};
document.getElementById("shortOnly").onclick=e=>{shortOnly=!shortOnly;e.currentTarget.classList.toggle("active",shortOnly);render();};
renderChips(); render();
</script>
</body>
</html>
